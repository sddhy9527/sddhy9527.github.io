<!doctype html>
<html>
<head>
    <meta cherset="utf-8">
    <title>雷渃</title>
     <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            overflow: hidden;
        }
        /* 流动背景容器 */
        .flow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            background: linear-gradient(-45deg, #fc0000, #0000ff, #ff0015, #0004ff);
            background-size: 400% 400%;
            animation: flowMove 12s ease infinite;
        }

        @keyframes flowMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .content{
            color:#fff;
            text-align:center;
            padding-top:30vh;
            font-size:32px;
        }
    </style>
</head>
<body>
    <div class="flow-bg"></div>

    <div class="content">
        雷渃
    </div>
</head>
</html>
